name: Daily MiC Analytics Ingestion

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ingest:
    name: Run all ingestion pipelines
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Fetch secrets from GCP Secret Manager
        run: |
          YOUTUBE_TOKEN=$(gcloud secrets versions access latest --secret=YOUTUBE_TOKEN)
          echo "::add-mask::$YOUTUBE_TOKEN"
          echo "YOUTUBE_TOKEN=$YOUTUBE_TOKEN" >> $GITHUB_ENV

          MAILCHIMP_API_KEY=$(gcloud secrets versions access latest --secret=MAILCHIMP_API_KEY)
          echo "::add-mask::$MAILCHIMP_API_KEY"
          echo "MAILCHIMP_API_KEY=$MAILCHIMP_API_KEY" >> $GITHUB_ENV

          MAILCHIMP_LIST_ID=$(gcloud secrets versions access latest --secret=MAILCHIMP_LIST_ID)
          echo "::add-mask::$MAILCHIMP_LIST_ID"
          echo "MAILCHIMP_LIST_ID=$MAILCHIMP_LIST_ID" >> $GITHUB_ENV

          STRIPE_API_KEY=$(gcloud secrets versions access latest --secret=STRIPE_API_KEY)
          echo "::add-mask::$STRIPE_API_KEY"
          echo "STRIPE_API_KEY=$STRIPE_API_KEY" >> $GITHUB_ENV

          WOOCOMMERCE_URL=$(gcloud secrets versions access latest --secret=WOOCOMMERCE_URL)
          echo "::add-mask::$WOOCOMMERCE_URL"
          echo "WOOCOMMERCE_URL=$WOOCOMMERCE_URL" >> $GITHUB_ENV

          WOOCOMMERCE_CONSUMER_KEY=$(gcloud secrets versions access latest --secret=WOOCOMMERCE_CONSUMER_KEY)
          echo "::add-mask::$WOOCOMMERCE_CONSUMER_KEY"
          echo "WOOCOMMERCE_CONSUMER_KEY=$WOOCOMMERCE_CONSUMER_KEY" >> $GITHUB_ENV

          WOOCOMMERCE_CONSUMER_SECRET=$(gcloud secrets versions access latest --secret=WOOCOMMERCE_CONSUMER_SECRET)
          echo "::add-mask::$WOOCOMMERCE_CONSUMER_SECRET"
          echo "WOOCOMMERCE_CONSUMER_SECRET=$WOOCOMMERCE_CONSUMER_SECRET" >> $GITHUB_ENV

          JOTFORM_API_KEY=$(gcloud secrets versions access latest --secret=JOTFORM_API_KEY)
          echo "::add-mask::$JOTFORM_API_KEY"
          echo "JOTFORM_API_KEY=$JOTFORM_API_KEY" >> $GITHUB_ENV

          JOTFORM_FORM_ID_STANDARD=$(gcloud secrets versions access latest --secret=JOTFORM_FORM_ID_STANDARD)
          echo "::add-mask::$JOTFORM_FORM_ID_STANDARD"
          echo "JOTFORM_FORM_ID_STANDARD=$JOTFORM_FORM_ID_STANDARD" >> $GITHUB_ENV

          JOTFORM_FORM_ID_MANUAL_OPT=$(gcloud secrets versions access latest --secret=JOTFORM_FORM_ID_MANUAL_OPT)
          echo "::add-mask::$JOTFORM_FORM_ID_MANUAL_OPT"
          echo "JOTFORM_FORM_ID_MANUAL_OPT=$JOTFORM_FORM_ID_MANUAL_OPT" >> $GITHUB_ENV

          SPOTIFY_CLIENT_ID=$(gcloud secrets versions access latest --secret=SPOTIFY_CLIENT_ID)
          echo "::add-mask::$SPOTIFY_CLIENT_ID"
          echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" >> $GITHUB_ENV

          SPOTIFY_CLIENT_SECRET=$(gcloud secrets versions access latest --secret=SPOTIFY_CLIENT_SECRET)
          echo "::add-mask::$SPOTIFY_CLIENT_SECRET"
          echo "SPOTIFY_CLIENT_SECRET=$SPOTIFY_CLIENT_SECRET" >> $GITHUB_ENV

          SPOTIFY_SHOW_ID_MIC=$(gcloud secrets versions access latest --secret=SPOTIFY_SHOW_ID_MIC)
          echo "::add-mask::$SPOTIFY_SHOW_ID_MIC"
          echo "SPOTIFY_SHOW_ID_MIC=$SPOTIFY_SHOW_ID_MIC" >> $GITHUB_ENV

          SPOTIFY_SHOW_ID_INNER_WORK=$(gcloud secrets versions access latest --secret=SPOTIFY_SHOW_ID_INNER_WORK)
          echo "::add-mask::$SPOTIFY_SHOW_ID_INNER_WORK"
          echo "SPOTIFY_SHOW_ID_INNER_WORK=$SPOTIFY_SHOW_ID_INNER_WORK" >> $GITHUB_ENV

      - name: Run YouTube ingestion
        continue-on-error: true
        env:
          TOKEN_FILE: /tmp/mic_token.json
          BQ_PROJECT: make-it-conscious
          BQ_DATASET: raw_youtube
          OAUTH_CLIENT_FILE: /tmp/dummy
        run: |
          echo "$YOUTUBE_TOKEN" > /tmp/mic_token.json
          python ingestion/youtube.py

      - name: Run Mailchimp ingestion
        continue-on-error: true
        env:
          MAILCHIMP_API_KEY: ${{ env.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ env.MAILCHIMP_LIST_ID }}
        run: python ingestion/mailchimp.py

      - name: Run Stripe ingestion
        continue-on-error: true
        env:
          STRIPE_API_KEY: ${{ env.STRIPE_API_KEY }}
        run: python ingestion/stripe_ingestion.py

      - name: Run WooCommerce ingestion
        continue-on-error: true
        env:
          WOOCOMMERCE_URL: ${{ env.WOOCOMMERCE_URL }}
          WOOCOMMERCE_CONSUMER_KEY: ${{ env.WOOCOMMERCE_CONSUMER_KEY }}
          WOOCOMMERCE_CONSUMER_SECRET: ${{ env.WOOCOMMERCE_CONSUMER_SECRET }}
        run: python ingestion/woocommerce.py

      - name: Run JotForm ingestion
        continue-on-error: true
        env:
          JOTFORM_API_KEY: ${{ env.JOTFORM_API_KEY }}
          JOTFORM_FORM_ID_STANDARD: ${{ env.JOTFORM_FORM_ID_STANDARD }}
          JOTFORM_FORM_ID_MANUAL_OPT: ${{ env.JOTFORM_FORM_ID_MANUAL_OPT }}
        run: python ingestion/jotform.py

      - name: Run WordPress ingestion
        continue-on-error: true
        run: python ingestion/wordpress.py

      - name: Run Spotify ingestion
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ env.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ env.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_SHOW_ID_MIC: ${{ env.SPOTIFY_SHOW_ID_MIC }}
          SPOTIFY_SHOW_ID_INNER_WORK: ${{ env.SPOTIFY_SHOW_ID_INNER_WORK }}
        run: python ingestion/spotify.py
